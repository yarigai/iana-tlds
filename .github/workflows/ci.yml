name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *" # Daily, 6am UTC

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tld_changed: ${{ steps.tld_check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      # The sync script only needs Node built-ins, so it runs before installing anything.
      - run: node scripts/update-tlds.mjs
      - name: Check if TLD list changed
        id: tld_check
        run: |
          if git diff --quiet src/data/tlds.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      # On a scheduled run with no TLD changes there is nothing to build or publish.
      - name: Decide whether to build
        id: gate
        run: echo "run=${{ github.event_name != 'schedule' || steps.tld_check.outputs.changed == 'true' }}" >> $GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'
      - run: pnpm run build
        if: steps.gate.outputs.run == 'true'
      - run: pnpm test:coverage
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'schedule' && steps.tld_check.outputs.changed == 'true')
        with:
          name: build-artifacts
          path: |
            dist/
            src/data/tlds.ts
          retention-days: 1

  publish:
    needs: build
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'schedule' && needs.build.outputs.tld_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # No install needed: dist/ comes prebuilt from the build job and npm ships with Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
      - name: Bump version (schedule only)
        if: github.event_name == 'schedule'
        run: npm version patch --no-git-tag-version
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view @yarigai/iana-tlds@${VERSION} version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Version ${VERSION} already published, skipping."
          else
            npm publish --access public --ignore-scripts --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Commit and push (schedule only)
        if: github.event_name == 'schedule'
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git config user.name "Yarigai CI Bot"
          git config user.email "ci-bot@yarigai.mx"
          git add src/data/tlds.ts package.json
          git commit -m "chore(sync): update IANA TLD list → v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "v${NEW_VERSION}"
      - name: Create GitHub Release
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release create "$TAG" --generate-notes --title "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
